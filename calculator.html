<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroParts | Калькулятор</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="navbar">
        <nav class="nav-links">
            <a href="index.html">
                <img src="./img/plane-icon.png" alt="Логотип самолета" class="nav-icon">
                <span>Главная</span>
            </a>
            <a href="calculator.html" class="active">Калькулятор</a>
            <a href="about.html">Об авторе</a>
            <a href="purpose.html">Цель работы</a>
        </nav>
        <div class="nav-actions">
            <a href="https://github.com/iu5git/JavaScript" target="_blank" rel="noopener noreferrer" class="btn btn-outline">GitHub</a>
        </div>
    </header>

    <main class="content-wrapper">
        <div class="calc-controls" style="margin-right: 20px; display: flex; flex-direction: column; gap: 10px;">
            <button id="change-bg-color" class="btn btn-outline" style="color: #1a1a1a; border-color: #1a1a1a;">Сменить фон</button>
            <button id="change-result-color" class="btn btn-outline" style="color: #1a1a1a; border-color: #1a1a1a;">Цвет экрана</button>
        </div>

        <section class="calculator" id="calculator">
            <div class="calc-display" id="result">0</div>

            <div class="calc-row">
                <button class="calc-btn op">M+</button>
                <button class="calc-btn op">M-</button>
                <button class="calc-btn op">MR</button>
               <button class="calc-btn op" title="В двоичный код">BIN</button>
            </div>
            
            <div class="calc-row">
                <button class="calc-btn op">x!</button>
                <button class="calc-btn op">x²</button>
                <button class="calc-btn op">√</button>
                <button class="calc-btn op">←</button>
            </div>

            <div class="calc-row">
                <button class="calc-btn op" id="btn_op_clear">C</button>
                <button class="calc-btn op">+/-</button>
                <button class="calc-btn op">%</button>
                <button class="calc-btn op">/</button>
            </div>
            <div class="calc-row">
                <button class="calc-btn">7</button>
                <button class="calc-btn">8</button>
                <button class="calc-btn">9</button>
                <button class="calc-btn op">x</button>
            </div>
            <div class="calc-row">
                <button class="calc-btn">4</button>
                <button class="calc-btn">5</button>
                <button class="calc-btn">6</button>
                <button class="calc-btn op">-</button>
            </div>
            <div class="calc-row">
                <button class="calc-btn">1</button>
                <button class="calc-btn">2</button>
                <button class="calc-btn">3</button>
                <button class="calc-btn op">+</button>
            </div>
            <div class="calc-row">
                <button class="calc-btn">0</button>
                <button class="calc-btn">000</button>
                <button class="calc-btn">.</button>
                <button class="calc-btn execute" id="btn_op_equal">=</button>
            </div>
        </section>
    </main>

    <script src="./js/script.js"></script>
</body>
</html>
