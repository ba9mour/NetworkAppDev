<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroParts | Калькулятор</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="navbar">
        <nav class="nav-links">
            <a href="index.html">
                <img src="./img/logo.png" alt="Логотип самолета" class="nav-icon">
                <span>Главная</span>
            </a>
            <a href="calculator.html" class="active">Калькулятор</a>
            <a href="about.html">Об авторе</a>
            <a href="purpose.html">Цель работы</a>
        </nav>
        <div class="nav-actions">
            <a href="https://github.com/iu5git/JavaScript" target="_blank" rel="noopener noreferrer" class="btn btn-outline">GitHub</a>
        </div>
    </header>

    <main class="content-wrapper">
        <section class="calculator" aria-label="Калькулятор расчетов">
            <div class="calc-display" id="result" aria-live="polite">0</div>

            <div class="calc-row">
                <button class="calc-btn op" aria-label="Очистить">C</button>
                <button class="calc-btn op" aria-label="Смена знака">+/-</button>
                <button class="calc-btn op" aria-label="Процент">%</button>
                <button class="calc-btn op" aria-label="Разделить">/</button>
            </div>
            <div class="calc-row">
                <button class="calc-btn">7</button>
                <button class="calc-btn">8</button>
                <button class="calc-btn">9</button>
                <button class="calc-btn op" aria-label="Умножить">x</button>
            </div>
            <div class="calc-row">
                <button class="calc-btn">4</button>
                <button class="calc-btn">5</button>
                <button class="calc-btn">6</button>
                <button class="calc-btn op" aria-label="Вычесть">-</button>
            </div>
            <div class="calc-row">
                <button class="calc-btn">1</button>
                <button class="calc-btn">2</button>
                <button class="calc-btn">3</button>
                <button class="calc-btn op" aria-label="Сложить">+</button>
            </div>
            <div class="calc-row">
                <button class="calc-btn">0</button>
                <button class="calc-btn" aria-label="Десятичная точка">.</button>
                <button class="calc-btn execute" aria-label="Вычислить">=</button>
            </div>
        </section>
    </main>
</body>
</html>
